<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Self Learning App</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- JavaScript File -->
    <script src="script.js"></script>
</head>

<body>

  <!-- TOP NAVIGATION BAR -->
  <nav class="top-navbar">

    <!-- Left Side -->
    <div class="nav-left">

      <div class="logo">
        Logo
      </div>

      <div class="app-title">
        Self Learning App
      </div>

    </div>


    <!-- Right Side -->
    <div class="nav-right">

      <a href="index.html" class="nav-link active">
        Home
      </a>

      <a href="lesson.html" class="nav-link">
        Lessons
      </a>

      <a href="practice.html" class="nav-link">
        Practice
      </a>

    </div>

  </nav>


  <!-- PROFILE SECTION -->
  <header class="top-section">

    <div class="profile-card">

      <!-- Profile Image -->
      <div class="profile-image">
        Photo
      </div>

      <!-- User Info -->
      <div class="profile-info">
        <div class="username">Username</div>
        <div class="user-level">Level</div>
        <div id="profilePoints">
          0 Points
        </div>
      </div>

    </div>

  </header>


  <!-- CENTER SECTION -->
  <main class="main-section">

    <section class="progress-map">

      <h2 class="map-title">
        Level Journey
      </h2>

      <div class="map-container">

        <div class="level-node completed">
          <span>1</span>
        </div>

        <div class="map-line"></div>

        <div class="level-node completed">
          <span>2</span>
        </div>

        <div class="map-line"></div>

        <div class="level-node current">
          <span>3</span>
        </div>

        <div class="map-line"></div>

        <div class="level-node">
          <span>4</span>
        </div>

        <div class="map-line"></div>

        <div class="level-node">
          <span>5</span>
        </div>


      </div>

    </section>

    <!-- START LESSON BUTTON -->
    <a href="lesson.html" class="start-button">
    Start Lesson
    </a>

  </main>


  

</body>
</html>
